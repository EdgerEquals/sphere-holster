# Granularity dial for the information-layer harness.
# Cursor (coordinator) picks a level per round; reviewers read it from here.
#   shallow = scouting (cheap, coarse, every few rounds)
#   deep    = validating (thorough, per-domain, before anything is called "locked")
# Model IDs verified 2026-10-19:
#   Anthropic: https://docs.claude.com/en/docs/about-claude/models/overview
#   xAI:       https://docs.x.ai/docs/models
#   Moonshot:  https://platform.moonshot.ai/docs/pricing/chat  (kimi-k2.6; kimi-k3 also listed, not used: pricier)
#   DeepSeek:  https://api-docs.deepseek.com/quick_start/pricing  (deepseek-flash, deepseek-v4-pro)
# Kimi + DeepSeek = free-tier rote checkers (harness/KIMI_START.md): units, arithmetic,
# consistency vs DESIGN_STATE.md, retired items. Called on demand only (/kimi-check, /deepseek-check).

default_level: shallow

# Push-to-main audits run only every N rounds (Cursor tags commits "[round N]"),
# or whenever the commit message contains "[audit]".
audit_every_n_rounds: 3

levels:
  shallow:
    claude_model: claude-sonnet-5-5
    claude_effort: medium       # output_config.effort; adaptive thinking counts toward max_tokens
    claude_max_tokens: 16000    # hard cap on thinking + reply
    grok_model: grok-4.7
    grok_reasoning_effort: low  # reasoning.effort; grok-4.7 default is high (slow); cannot be disabled
    grok_max_tokens: 4000       # visible output cap
    grok_web_search: false      # xAI built-in search off; Grok gets one Tavily pre-search instead (tavily.grok_presearch)
    grok_max_turns: 3           # agentic search turns
    grok_max_diff_chars: 30000  # Grok checks claims, it does not need the whole diff
    grok_idle_timeout_s: 180    # streaming: fail if no bytes for this long
    grok_deadline_s: 900        # streaming: hard wall-clock limit per call
    max_diff_chars: 60000
    per_domain_calls: false     # one combined call: coordinator-merge + touched domains
    max_calls: 1
    kimi_model: kimi-k2.6
    kimi_max_tokens: 12000      # thinking + reply; kimi-k2.6 thinks even on trivial prompts, keep >= 12000
    kimi_max_diff_chars: 30000
    kimi_idle_timeout_s: 180    # streaming: fail if no bytes for this long
    kimi_deadline_s: 600        # streaming: hard wall-clock limit per call
    deepseek_model: deepseek-flash
    deepseek_max_tokens: 8000   # thinking + reply (thinking is on by default)
    deepseek_max_diff_chars: 30000
    deepseek_idle_timeout_s: 180
    deepseek_deadline_s: 600
  deep:
    claude_model: claude-opus-5-5
    claude_effort: high
    claude_max_tokens: 32000
    grok_model: grok-4.7
    grok_reasoning_effort: medium
    grok_max_tokens: 10000
    grok_web_search: false      # xAI built-in search off; Grok gets one Tavily pre-search instead (tavily.grok_presearch)
    grok_max_turns: 8
    grok_max_diff_chars: 120000
    grok_idle_timeout_s: 240
    grok_deadline_s: 1500
    max_diff_chars: 200000
    per_domain_calls: true      # one call per touched domain + one coordinator-merge call
    max_calls: 7
    kimi_model: kimi-k2.6
    kimi_max_tokens: 16000
    kimi_max_diff_chars: 60000
    kimi_idle_timeout_s: 240
    kimi_deadline_s: 900
    deepseek_model: deepseek-v4-pro
    deepseek_max_tokens: 16000
    deepseek_max_diff_chars: 60000
    deepseek_idle_timeout_s: 240
    deepseek_deadline_s: 900

# Claude Code (end-of-iteration reviews via anthropics/claude-code-action)
claude_code:
  model: claude-opus-5-5
  max_turns: 30

# Which domain prompts apply to a changed file. Matched case-insensitively
# against the file path AND the added lines of the diff. coordinator-merge always applies.
domains:
  optical:   [optical, optic, balmer, phosphor, fresnel, ksf, casn, refractive, photon, "nm\\b", wavelength, ppln, kdp]
  acoustic:  [acoustic, sound, elastic, mode, breathing, "mhz", spheroidal, thickness_mode, cl_, "c_l"]
  electric:  [electric, field, voltage, paschen, dbd, capacitance, bto, varactor, plasma, ionis, ioniz, emf, drive]
  magnetic:  [magnetic, ferrite, inductance, "b_field", tesla, gauss, permeab]
  thermal:   [thermal, temperature, heat, conduct, curie, autoignition, convection, radiat, kelvin]
  chemical:  [chemical, chem, radical, recombin, hho, hydrogen, oxygen, h2o, enthalpy, combust]

# Shared web-search slot (Tavily, POST https://api.tavily.com/search). Any model or Cursor can use it:
#   gh workflow run tavily-search.yml -f query='<query>'   (or comment "/tavily-search <query>")
# Order of spend: Kimi/DeepSeek search + filter FIRST (web_search on their rote check), Claude/Grok spend only after
# that filter (reviews/2026-10-19_round2: "cheap pre-filter ahead of the paid reviewers").
# enabled = default for the Kimi/DeepSeek pre-search when a run does not say; per-run web_search=true overrides.
# Without the TAVILY_API_KEY secret every Tavily step reports "not configured" and makes no call.
# Cost: basic = 1 credit, advanced = 2; free plan 1,000 credits/month (https://docs.tavily.com/documentation/quickstart).
# Kimi/DeepSeek: a run that gives a search query (input or "search: <query>" comment line) searches; else `enabled`.
# Grok: one Tavily pre-search per review, ON by default (replaces xAI's built-in web search, which is pricier).
#   Query = "search: <query>" line / search_query input, else derived from the PR title/commit + changed files.
#   Opt out per run: "/grok-check nosearch", or -f web_search=false; globally: grok_presearch: false.
tavily:
  enabled: false
  max_results: 5
  search_depth: basic
  grok_presearch: true
  grok_max_results: 5         # hard cap 5, basic depth, 1 search per Grok run (1 credit)
