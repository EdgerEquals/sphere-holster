# Granularity dial for the information-layer harness.
# Cursor (coordinator) picks a level per round; reviewers read it from here.
#   shallow = scouting (cheap, coarse, every few rounds)
#   deep    = validating (thorough, per-domain, before anything is called "locked")
# Model IDs verified 2026-10-19:
#   Anthropic: https://docs.claude.com/en/docs/about-claude/models/overview
#   xAI:       https://docs.x.ai/docs/models

default_level: shallow

# Push-to-main audits run only every N rounds (Cursor tags commits "[round N]"),
# or whenever the commit message contains "[audit]".
audit_every_n_rounds: 3

levels:
  shallow:
    claude_model: claude-sonnet-5-5
    claude_effort: medium       # output_config.effort; adaptive thinking counts toward max_tokens
    claude_max_tokens: 16000    # hard cap on thinking + reply
    grok_model: grok-4.7
    grok_reasoning_effort: low  # reasoning.effort; grok-4.7 default is high (slow); cannot be disabled
    grok_max_tokens: 4000       # visible output cap
    grok_web_search: true
    grok_max_turns: 3           # agentic search turns
    grok_max_diff_chars: 30000  # Grok checks claims, it does not need the whole diff
    grok_idle_timeout_s: 180    # streaming: fail if no bytes for this long
    grok_deadline_s: 900        # streaming: hard wall-clock limit per call
    max_diff_chars: 60000
    per_domain_calls: false     # one combined call: coordinator-merge + touched domains
    max_calls: 1
  deep:
    claude_model: claude-opus-5-5
    claude_effort: high
    claude_max_tokens: 32000
    grok_model: grok-4.7
    grok_reasoning_effort: medium
    grok_max_tokens: 10000
    grok_web_search: true
    grok_max_turns: 8
    grok_max_diff_chars: 120000
    grok_idle_timeout_s: 240
    grok_deadline_s: 1500
    max_diff_chars: 200000
    per_domain_calls: true      # one call per touched domain + one coordinator-merge call
    max_calls: 7

# Claude Code (end-of-iteration reviews via anthropics/claude-code-action)
claude_code:
  model: claude-opus-5-5
  max_turns: 30

# Which domain prompts apply to a changed file. Matched case-insensitively
# against the file path AND the added lines of the diff. coordinator-merge always applies.
domains:
  optical:   [optical, optic, balmer, phosphor, fresnel, ksf, casn, refractive, photon, "nm\\b", wavelength, ppln, kdp]
  acoustic:  [acoustic, sound, elastic, mode, breathing, "mhz", spheroidal, thickness_mode, cl_, "c_l"]
  electric:  [electric, field, voltage, paschen, dbd, capacitance, bto, varactor, plasma, ionis, ioniz, emf, drive]
  magnetic:  [magnetic, ferrite, inductance, "b_field", tesla, gauss, permeab]
  thermal:   [thermal, temperature, heat, conduct, curie, autoignition, convection, radiat, kelvin]
  chemical:  [chemical, chem, radical, recombin, hho, hydrogen, oxygen, h2o, enthalpy, combust]
