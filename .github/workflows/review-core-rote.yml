# Reusable core for the free-tier rote checkers (Kimi, DeepSeek). Called by kimi-check.yml and deepseek-check.yml.
# Kept separate from review-core.yml so the Claude/Grok pipeline is untouched.
# Not triggered directly. Scripts always run from the DEFAULT BRANCH checkout; the reviewed ref is
# only fetched as data (git diff), never executed.
name: review-core-rote

on:
  workflow_call:
    inputs:
      reviewer:       { type: string, required: true }   # kimi | deepseek
      trigger_phrase: { type: string, required: true }   # /kimi-check | /deepseek-check
      secret_name:    { type: string, required: true }   # MOONSHOT_API_KEY | DEEPSEEK_API_KEY
      depth:          { type: string, required: false, default: "" }
      target_ref:     { type: string, required: false, default: "" }
      base_ref:       { type: string, required: false, default: "" }
      pr_number:      { type: string, required: false, default: "" }
      domains:        { type: string, required: false, default: "" }
      ping:           { type: string, required: false, default: "" }
    secrets:
      API_KEY: { required: false }

permissions:
  contents: read

jobs:
  # ---- ping: just send a prompt, reply + token usage go to the job summary (nothing posted) ----
  ping:
    if: github.event_name == 'workflow_dispatch' && inputs.ping != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Models visible to the key (informational)
        continue-on-error: true
        env:
          API_KEY: ${{ secrets.API_KEY }}
          SECRET_NAME: ${{ inputs.secret_name }}
          REVIEWER: ${{ inputs.reviewer }}
        run: |
          [ -n "$API_KEY" ] && export "$SECRET_NAME=$API_KEY"; unset API_KEY
          python "scripts/review_$REVIEWER.py" --list-models
      - name: Ping ${{ inputs.reviewer }}
        env:
          API_KEY: ${{ secrets.API_KEY }}
          SECRET_NAME: ${{ inputs.secret_name }}
          REVIEWER: ${{ inputs.reviewer }}
          PING: ${{ inputs.ping }}
          DEPTH: ${{ inputs.depth }}
        run: |
          [ -n "$API_KEY" ] && export "$SECRET_NAME=$API_KEY"; unset API_KEY
          args=(--ping "$PING" --out ping-out)
          [ -n "$DEPTH" ] && args+=(--depth "$DEPTH")
          python "scripts/review_$REVIEWER.py" "${args[@]}"
      - name: Upload ping result
        if: always() && hashFiles('ping-out/ping.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.reviewer }}-ping-${{ github.run_id }}
          path: ping-out/
          retention-days: 14

  gate:
    if: github.event_name != 'workflow_dispatch' || inputs.ping == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: write   # to add an "eyes" reaction to the trigger comment
    outputs:
      run:     ${{ steps.g.outputs.run }}
      depth:   ${{ steps.g.outputs.depth }}
      target:  ${{ steps.g.outputs.target }}
      base:    ${{ steps.g.outputs.base }}
      pr:      ${{ steps.g.outputs.pr }}
      domains: ${{ steps.g.outputs.domains }}
      reason:  ${{ steps.g.outputs.reason }}
    steps:
      - id: g
        name: Decide whether to run, and on what
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PHRASE: ${{ inputs.trigger_phrase }}
          IN_DEPTH: ${{ inputs.depth }}
          IN_TARGET: ${{ inputs.target_ref }}
          IN_BASE: ${{ inputs.base_ref }}
          IN_PR: ${{ inputs.pr_number }}
          IN_DOMAINS: ${{ inputs.domains }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ID: ${{ github.event.comment.id }}
          AUTHOR_ASSOC: ${{ github.event.comment.author_association }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          IS_PR: ${{ github.event.issue.pull_request.url }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          set -f   # no globbing of comment words
          run=false; depth=""; target=""; base=""; pr=""; domains=auto; reason=""
          case "$EVENT" in
            issue_comment)
              first=$(printf '%s\n' "$COMMENT_BODY" | head -n1 | tr -d '\r')
              case "$first" in
                "$PHRASE"|"$PHRASE "*) ;;
                *) reason="comment does not start with $PHRASE"; first="";;
              esac
              if [ -n "$first" ]; then
                case "$AUTHOR_ASSOC" in
                  OWNER|MEMBER|COLLABORATOR) run=true ;;
                  *) reason="ignored: $AUTHOR_ASSOC users cannot trigger paid reviews on this public repo" ;;
                esac
              fi
              if [ "$run" = true ]; then
                for w in ${first#"$PHRASE"}; do
                  case "$w" in
                    shallow|deep) depth=$w ;;
                    domains=*) domains=${w#domains=} ;;
                  esac
                done
                gh api "repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content=eyes >/dev/null || true
                if [ -n "$IS_PR" ]; then
                  pr=$ISSUE_NUMBER
                  target="refs/pull/$pr/head"
                  base=$(gh pr view "$pr" -R "$REPO" --json baseRefName --jq .baseRefName)
                else
                  target="$DEFAULT_BRANCH"   # comment on a plain issue: check latest default-branch commit
                fi
              fi ;;
            workflow_dispatch)
              run=true; depth=$IN_DEPTH; target=${IN_TARGET:-$DEFAULT_BRANCH}
              base=$IN_BASE; pr=$IN_PR; domains=${IN_DOMAINS:-auto} ;;
            *) reason="unsupported event $EVENT" ;;
          esac
          {
            echo "run=$run"; echo "depth=$depth"; echo "target=$target"
            echo "base=$base"; echo "pr=$pr"; echo "domains=$domains"; echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"
          echo "gate: run=$run depth=${depth:-default} target=$target base=${base:-auto} pr=${pr:-none} :: $reason"

  review:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      REVIEWER: ${{ inputs.reviewer }}
      SECRET_NAME: ${{ inputs.secret_name }}
      DEPTH: ${{ needs.gate.outputs.depth }}
      TARGET: ${{ needs.gate.outputs.target }}
      BASE: ${{ needs.gate.outputs.base }}
      PR: ${{ needs.gate.outputs.pr }}
      DOMAINS: ${{ needs.gate.outputs.domains }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }

      - name: Fetch the ref under review (as data only)
        id: refs
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$TARGET:refs/review/head"
          head_sha=$(git rev-parse refs/review/head)
          if [ -n "$BASE" ]; then
            git fetch --no-tags origin "$BASE" 2>/dev/null || true
            base_ref=$(git rev-parse --verify -q "origin/$BASE" || git rev-parse --verify -q "$BASE" || true)
            [ -n "$base_ref" ] && base_sha=$(git merge-base "$base_ref" "$head_sha" || echo "$base_ref") || base_sha=""
          else base_sha=""; fi
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          if [ -n "$PR" ]; then gh pr view "$PR" -R "$REPO" --json title,body --jq '"\(.title)\n\n\(.body)"' > intent.txt || : > intent.txt
          else git log -1 --format=%B "$head_sha" > intent.txt; fi

      - name: Run ${{ inputs.reviewer }} rote check
        id: run
        env:
          API_KEY: ${{ secrets.API_KEY }}
          HEAD_SHA: ${{ steps.refs.outputs.head_sha }}
          BASE_SHA: ${{ steps.refs.outputs.base_sha }}
        run: |
          set +e
          [ -n "$API_KEY" ] && export "$SECRET_NAME=$API_KEY"; unset API_KEY
          args=(--head "$HEAD_SHA" --domains "${DOMAINS:-auto}" --mode review --out review-out --intent "$(cat intent.txt)")
          [ -n "$DEPTH" ] && args+=(--depth "$DEPTH")
          [ -n "$BASE_SHA" ] && args+=(--base "$BASE_SHA")
          python "scripts/review_$REVIEWER.py" "${args[@]}" 2>&1 | tee review.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ ! -f review-out/verdict.md ]; then
            # Script died before writing a verdict: still leave something to upload and post.
            mkdir -p review-out
            {
              echo "## ⚠️ ${REVIEWER} review: **ERROR**"
              echo
              echo "The reviewer script exited with code $code before writing a verdict. Last lines of its log:"
              echo
              echo '```'
              tail -n 25 review.log | sed -E 's/(sk-|Bearer )[A-Za-z0-9_-]{8,}/[redacted]/g'
              echo '```'
            } > review-out/verdict.md
            python -c "import json,sys;json.dump({'reviewer':sys.argv[1],'overall_verdict':'ERROR','exit_code':int(sys.argv[2]),'results':[]},open('review-out/verdict.json','w'))" "$REVIEWER" "$code"
          fi
          verdict=$(python -c "import json;print(json.load(open('review-out/verdict.json'))['overall_verdict'])" 2>/dev/null || echo ERROR)
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload verdict artifact
        if: always() && hashFiles('review-out/verdict.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.reviewer }}-verdict-${{ steps.refs.outputs.head_sha }}
          path: review-out/
          retention-days: 30
          overwrite: true

      - name: Post verdict (PR comment, else issue)
        if: always() && hashFiles('review-out/verdict.md') != ''
        env:
          VERDICT: ${{ steps.run.outputs.verdict }}
          HEAD_SHA: ${{ steps.refs.outputs.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          { cat review-out/verdict.md; echo; echo "<sub>[Run log and JSON artifact]($RUN_URL)</sub>"; } > body.md
          if [ -n "$PR" ]; then
            gh pr comment "$PR" -R "$REPO" --body-file body.md
          else
            gh issue create -R "$REPO" --title "[$REVIEWER] ${VERDICT:-ERROR} for ${HEAD_SHA:0:12}" --body-file body.md
          fi

      - name: Final status
        env:
          CODE: ${{ steps.run.outputs.exit_code }}
          VERDICT: ${{ steps.run.outputs.verdict }}
        run: |
          case "$CODE" in
            0) ;;
            2) echo "::error title=Missing secret $SECRET_NAME::Repository secret $SECRET_NAME is not set, so the $REVIEWER check was skipped (no tokens used)."; exit 1 ;;
            3) echo "::error title=$REVIEWER check error::The API call failed, timed out, or returned no parseable verdict. See the posted issue/comment and the step log."; exit 1 ;;
            *) echo "::error title=$REVIEWER script crashed::scripts/review_$REVIEWER.py exited with code ${CODE:-unknown}. See the posted issue/comment and the step log."; exit 1 ;;
          esac
          case "$VERDICT" in
            PASS) echo "$REVIEWER verdict: PASS" ;;
            FAIL) echo "::error title=$REVIEWER verdict FAIL::See the posted comment; this goes back to Cursor."; exit 1 ;;
            *)    echo "::error title=$REVIEWER verdict ${VERDICT:-missing}::No usable verdict. See the posted issue/comment."; exit 1 ;;
          esac
