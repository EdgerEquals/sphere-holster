# Claude API inner-loop audit of Cursor's latest merge/diff against the harness spec.
# Triggers:
#   - comment "/claude-audit [shallow|deep] [cross] [domains=a,b]" on a PR (or issue -> reviews default branch)
#   - Actions tab / `gh workflow run claude-audit.yml -f depth=deep -f target_ref=<ref>`
#   - push to main, ONLY when the commit message has "[audit]" or "[round N]" with N % audit_every_n_rounds == 0
name: claude-audit

on:
  workflow_dispatch:
    inputs:
      depth:
        description: Granularity dial (shallow = scouting, deep = validating)
        type: choice
        options: [shallow, deep]
        default: shallow
      target_ref:
        description: Ref to audit (branch, tag, SHA, or refs/pull/N/head). Default = default branch.
        type: string
        default: ""
      base_ref:
        description: Optional base ref; diff is merge-base(base, target)..target. Default = target's first parent.
        type: string
        default: ""
      pr_number:
        description: Optional PR number to post the verdict on (else an issue is opened)
        type: string
        default: ""
      mode:
        description: review, or crosscheck (gives Claude the latest Grok verdict for the same commit)
        type: choice
        options: [review, crosscheck]
        default: review
      domains:
        description: auto | all | comma list of optical,acoustic,electric,magnetic,thermal,chemical
        type: string
        default: auto
  issue_comment:
    types: [created]
  push:
    branches: [main]

concurrency:
  group: claude-audit-${{ github.event.issue.number || inputs.target_ref || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    if: github.event_name != 'issue_comment' || startsWith(github.event.comment.body, '/claude-audit')
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    uses: ./.github/workflows/review-core.yml
    with:
      reviewer: claude
      trigger_phrase: /claude-audit
      depth: ${{ inputs.depth }}
      target_ref: ${{ inputs.target_ref }}
      base_ref: ${{ inputs.base_ref }}
      pr_number: ${{ inputs.pr_number }}
      mode: ${{ inputs.mode }}
      domains: ${{ inputs.domains }}
      allow_push_gate: true
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
