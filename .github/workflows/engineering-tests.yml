# Engineering stack, connection 1: SymPy re-derives locked values from DESIGN_STATE.md and checks
# solver_v0.py against them. Expected-vs-got table goes to the job summary; mismatches are annotated.
name: engineering-tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engineering-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  locked-values:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned engineering stack
        run: python -m pip install -r requirements.txt

      - name: Locked-value tests (pytest + SymPy)
        working-directory: tests
        run: |
          set +e
          python -m pytest -c pytest.ini 2>&1 | tee pytest.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ] && [ ! -f out/locked_values_report.md ]; then
            {
              echo "## ❌ Engineering tests crashed before reporting (exit $code)"
              echo '```'; tail -n 40 pytest.log; echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$code" -ne 0 ]; then
            echo "::error title=Locked-value tests failed::See the job summary for expected vs got."
          fi
          exit "$code"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: locked-values-report
          path: |
            tests/out/
            tests/pytest.log
          if-no-files-found: ignore
          retention-days: 30
