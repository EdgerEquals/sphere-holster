# Claude Code end-of-iteration review (official anthropics/claude-code-action, v1 major tag;
# latest release at setup time v1.0.253, 2026-10-19 AWST). Files issues and drafts the next change.
# Triggers:
#   - "@claude ..." in a PR/issue comment, PR review, PR review comment, or a new/assigned issue
#   - Actions tab / `gh workflow run claude-code-review.yml -f iteration=<n> -f since_ref=<ref>`
# Auth: ANTHROPIC_API_KEY secret + the Claude GitHub App (https://github.com/apps/claude).
#   If you would rather not install the app, set repo variable CLAUDE_USE_GITHUB_TOKEN=true
#   (comments then come from github-actions[bot], and its pushes will not trigger other workflows).
name: claude-code-review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]
  workflow_dispatch:
    inputs:
      iteration:
        description: Iteration label/number being closed out (e.g. 4)
        type: string
        required: true
      since_ref:
        description: Ref where this iteration started (tag/SHA). Review covers since_ref..target_ref
        type: string
        default: ""
      target_ref:
        description: Ref to review (default = default branch)
        type: string
        default: ""
      depth:
        description: Granularity dial
        type: choice
        options: [shallow, deep]
        default: deep
      extra_instructions:
        description: Anything specific to look at
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: claude-code-${{ github.event.issue.number || github.event.pull_request.number || inputs.iteration || github.run_id }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write   # required by the Claude GitHub App auth path
      actions: read     # lets Claude read CI results / reviewer verdict runs
    steps:
      - name: Check ANTHROPIC_API_KEY
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number || github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$HAS_KEY" != true ]; then
            msg="ANTHROPIC_API_KEY is not set, so the Claude Code review was skipped (no tokens used). Add it under Settings > Secrets and variables > Actions."
            echo "::error title=Missing secret ANTHROPIC_API_KEY::$msg"
            if [ -n "$ISSUE" ]; then gh issue comment "$ISSUE" -R "$REPO" --body "⏭️ $msg" || true; fi
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read dial settings
        id: dial
        run: |
          model=$(awk '/^claude_code:/{f=1;next} f&&/^[^ ]/{f=0} f&&/model:/{print $2;exit}' harness/dial.yml)
          turns=$(awk '/^claude_code:/{f=1;next} f&&/^[^ ]/{f=0} f&&/max_turns:/{print $2;exit}' harness/dial.yml)
          echo "model=${model:-claude-opus-5-5}" >> "$GITHUB_OUTPUT"
          echo "turns=${turns:-30}" >> "$GITHUB_OUTPUT"

      # Interactive mode: "@claude ..." mentions. Claude replies in the thread and can push to its own branch.
      - name: Claude Code (@claude mention)
        if: github.event_name != 'workflow_dispatch'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ vars.CLAUDE_USE_GITHUB_TOKEN == 'true' && github.token || '' }}
          trigger_phrase: "@claude"
          additional_permissions: |
            actions: read
          claude_args: |
            --model ${{ steps.dial.outputs.model }}
            --max-turns ${{ steps.dial.outputs.turns }}
            --append-system-prompt "You are the end-of-iteration reviewer in the Stratified Sphere information-layer harness. Read AGENTS.md and harness/README.md first. Apply harness/prompts/_base.md, coordinator-merge.md and the relevant domain prompts. Flag any retired item listed in harness/retired.txt. Never edit .github/workflows. Do not merge or push to main."

      # Automation mode: end-of-iteration review started from the Actions tab or `gh workflow run`.
      - name: Claude Code (end-of-iteration review)
        if: github.event_name == 'workflow_dispatch'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ vars.CLAUDE_USE_GITHUB_TOKEN == 'true' && github.token || '' }}
          prompt: |
            REPO: ${{ github.repository }}
            ITERATION: ${{ inputs.iteration }}
            RANGE: ${{ inputs.since_ref || '(previous iteration tag or last 20 commits)' }}..${{ inputs.target_ref || github.event.repository.default_branch }}
            DIAL: ${{ inputs.depth }}

            You are the END-OF-ITERATION reviewer (Claude Code) in the Stratified Sphere information-layer harness.
            1. Read AGENTS.md, harness/README.md, harness/retired.txt and harness/prompts/*.md.
            2. Review every change in RANGE (git log / git diff). Also read the latest claude-audit and grok-check
               verdicts on recent PRs/issues (gh pr list, gh issue list, gh run list) and note any FAIL not yet addressed.
            3. For each real problem, file ONE GitHub issue (gh issue create) titled "[iter ${{ inputs.iteration }}] <domain>: <problem>",
               body: what, where (file:line), why it matters physically, suggested fix, and whether a Grok source check is needed.
               Search existing issues first; do not duplicate.
            4. Draft the next change: create branch claude/iter-${{ inputs.iteration }}-next, make the smallest coherent
               change that addresses the top-priority issue, and open a DRAFT PR referencing the issues. Never push to main,
               never edit .github/workflows, never reintroduce a retired item.
            5. Finish with one issue titled "[iter ${{ inputs.iteration }}] end-of-iteration review" containing a PASS/FAIL
               summary, the list of issues filed, the draft PR link, and open questions for Danny.
            Extra instructions: ${{ inputs.extra_instructions }}
          claude_args: |
            --model ${{ steps.dial.outputs.model }}
            --max-turns ${{ steps.dial.outputs.turns }}
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git status:*),Bash(git checkout:*),Bash(git switch:*),Bash(git add:*),Bash(git commit:*),Bash(git push origin claude/*),Bash(gh issue create:*),Bash(gh issue list:*),Bash(gh issue view:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(gh pr create:*),Bash(gh run list:*),Bash(gh run view:*),Bash(python3 solver_v0.py:*)"
