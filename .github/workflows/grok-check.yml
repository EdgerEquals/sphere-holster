# Grok (xAI API) source / physics-claims cross-check of Cursor's latest merge/diff.
# Web search: one Tavily pre-search per run (default on; xAI built-in search off, see harness/dial.yml).
# Triggers:
#   - comment "/grok-check [shallow|deep] [cross] [domains=a,b] [nosearch]" on a PR (or issue -> reviews default
#     branch); an optional later line "search: <query>" sets the Tavily query (else derived from title + files)
#   - Actions tab / `gh workflow run grok-check.yml -f depth=deep -f target_ref=<ref>`
#   Grok is an open channel: run it whenever Cursor or the bot needs a source/physics claim checked.
name: grok-check

on:
  workflow_dispatch:
    inputs:
      depth:
        description: Granularity dial (shallow = scouting, deep = validating)
        type: choice
        options: [shallow, deep]
        default: shallow
      target_ref:
        description: Ref to audit (branch, tag, SHA, or refs/pull/N/head). Default = default branch.
        type: string
        default: ""
      base_ref:
        description: Optional base ref; diff is merge-base(base, target)..target. Default = target's first parent.
        type: string
        default: ""
      pr_number:
        description: Optional PR number to post the verdict on (else an issue is opened)
        type: string
        default: ""
      mode:
        description: review, or crosscheck (gives Grok the latest Claude verdict for the same commit)
        type: choice
        options: [review, crosscheck]
        default: review
      domains:
        description: auto | all | comma list of optical,acoustic,electric,magnetic,thermal,chemical
        type: string
        default: auto
      web_search:
        description: "Tavily pre-search: '' = dial default (on), false = opt out for this run"
        type: string
        default: ""
      search_query:
        description: Tavily query (default = derived from the PR title / commit + changed files)
        type: string
        default: ""
  issue_comment:
    types: [created]

concurrency:
  group: grok-check-${{ github.event.issue.number || inputs.target_ref || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    if: github.event_name != 'issue_comment' || startsWith(github.event.comment.body, '/grok-check')
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    uses: ./.github/workflows/review-core.yml
    with:
      reviewer: grok
      trigger_phrase: /grok-check
      depth: ${{ inputs.depth }}
      target_ref: ${{ inputs.target_ref }}
      base_ref: ${{ inputs.base_ref }}
      pr_number: ${{ inputs.pr_number }}
      mode: ${{ inputs.mode }}
      domains: ${{ inputs.domains }}
      allow_push_gate: false
      web_search: ${{ inputs.web_search }}
      search_query: ${{ inputs.search_query }}
    secrets:
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
